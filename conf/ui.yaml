# ==========================================================
# UI 层配置（可提交到仓库，不放密码）
# 账号密码复用 conf/config.yaml -> environments.<env>.accounts.admin
# ==========================================================

# 平台首页（前端根地址，不带 webapi 后缀）
base_url: "https://ytest.gpstracktech.com"

# 登录页路由（hash 路由）
login_path: "/#/loginv2"

viewport:
  width: 1600
  height: 900

timeouts:
  # 单元素等待
  default: 15000
  # 页面导航
  navigation: 30000
  # 断言重试（Playwright expect 默认 5s，这里放宽）
  expect: 10000

browser:
  # 首选渠道：chrome
  # 理由：平台用户绝大多数用 Chrome，用同一内核排查问题才有意义
  #        （不同内核的渲染差异会变成"我本地好的啊"这类扯皮）
  channel: "chrome"
  # 首选不可用时按顺序回退；全部不可用则用 Playwright 自带 chromium（需先 install）
  fallback_channels: ["msedge"]
  # 无头模式。排查时用命令行 --headed 覆盖，不用改配置
  headless: true
  # 去掉 UA 里的 Headless 标记，避免前端/风控把自动化当爬虫
  mask_headless_ua: true

# 登录态复用：第一次跑会真实登录一次并落盘，后续用例直接复用
state_file: "logs/ui_state.json"
# 登录态有效期（小时），超过则重新登录
state_ttl_hours: 12

# 失败留证目录（trace / 截图）
artifact_dir: "logs/ui_artifacts"
