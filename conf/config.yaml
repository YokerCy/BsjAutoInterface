# config.yaml
#
# 【凭据规范】本文件进公开仓库，禁止写入真实账号/密码/密钥。
# 所有凭据统一写 ${变量名} 占位符，实际值按以下优先级注入：
#   1. 环境变量                          TEST_USERNAME / TEST_PASSWORD / OPEN_API_KEY
#   2. conf/config.local.yaml -> secrets.<变量名>（本地私有，已被 .gitignore 忽略）
# 缺少必填项时启动即报错，不会静默用空值去登录。
default: "test"

environments:
  test:
    base_url: "https://ytest.gpstracktech.com/webapi/"
    base_api_url: "https://ytest.gpstracktech.com/api/" #调用api接口
    timeout: 5
    accounts:
      admin:
        username: "${TEST_USERNAME}"
        password: "${TEST_PASSWORD}"
    common_params:
      __sm_ver: "1.21.3-4,20250718190538"
      platform: "PC"
      version: "base"
    common_headers:
      key: "${OPEN_API_KEY}"
      version: "1.0"
      Accept-Language: "en"
      Content-Type: "application/json"

  prod:
    base_url: "https://api.example.com"
    timeout: 10

endpoints:
  login: "/user/login"
  userTree: "/user/getUserTree"
  addUser: "/user/addUser"
  delUser: "/user/delUser"
  updateUser: "/user/updateUser"
  loadSimpleByUsers: "/monitor/loadSimpleByUsers"
  add_Group: "/group/add"
  delete_Group: "/group/remove"
  add_vehicle: "/vehicle/addVehicle"
  group_list: "/group/list"
  user_device: "/monitor/getUserDevice"
  group_one: "/group/one"
  historical_trajectory: "/track/getTrackList"
  real_time_location_api: "/monitor/getRealTimeInfo"
  get_alarm_type: "/alarm/getAlarmType"
  alarm_info: "/alarm/getAlarmInfo"
  ai_event_alarm_info: "/alarm/recentlyAdasList"
  parking_record: "/parkingReport/list"
  mileage_report: "/mileageReport/list"
  itinerary_analysis: "/itineraryAnalysis/getItineraryAnalysisPageData"
  oil_vehicle_fuel: "/oil/vehicleFuel"
  temp_humidity_report: "/tempHumidityReport/getTempHumidityReport"
  temp_humidity_detail_report: "/tempHumidityReport/getTempHumidityDetailReport"

