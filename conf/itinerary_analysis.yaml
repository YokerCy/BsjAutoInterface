- case_name: "获取行程分析分页数据"
  interface: "get_itinerary_analysis_page_data"
  expect_code: 200
  expect_msg: "Success"
  payload:
    vehicle_ids: [89641]
    startTime: "2026-09-29 00:00:00"
    endTime: "2026-09-29 23:59:59"
    filterStatus: 0
