#   vehicleIds -> number[]  必填，车辆ID（数字数组，注意不是设备号字符串）
#   startTime / endTime -> yyyy-MM-dd HH:mm:ss
#   filterStatus -> 0 全部 / 其他值按平台定义（当前沿用抓包值 0）
